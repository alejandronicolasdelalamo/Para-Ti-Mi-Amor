<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Para el amor de mi vida</title>
  <meta name="description" content="Una carta de San Valentín: planta un corazón y mira crecer un árbol entero de ellos.">
  <meta name="theme-color" content="#12040e">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Para el amor de mi vida">
  <meta property="og:description" content="Planta un corazón y mira crecer un árbol entero de ellos.">
  <meta property="og:image" content="https://alejandronicolasdelalamo.github.io/Para-Ti-Mi-Amor/docs/portada.jpg">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Newsreader:ital,opsz,wght@0,6..72,400..500;1,6..72,400..500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <canvas class="escena" id="escena" aria-hidden="true"></canvas>

  <main class="pagina">
    <section class="carta" id="carta" aria-labelledby="titulo">
      <h1 class="carta__titulo" id="titulo"></h1>
      <!-- El texto animado es decorativo; los lectores de pantalla leen la copia íntegra. -->
      <div class="carta__texto" id="mensaje" aria-hidden="true"></div>
      <div class="solo-lectores" id="mensajeAccesible"></div>
    </section>

    <div class="arbol-zona" id="zonaArbol"></div>

    <section class="contador" id="contador" aria-label="Tiempo transcurrido">
      <p class="contador__intro" id="contadorIntro"></p>
      <div class="contador__cifras" aria-hidden="true">
        <div class="cifra"><span class="cifra__valor" id="dias">0</span><span class="cifra__unidad" id="diasUnidad">días</span></div>
        <div class="cifra"><span class="cifra__valor" id="horas">0</span><span class="cifra__unidad" id="horasUnidad">horas</span></div>
        <div class="cifra"><span class="cifra__valor" id="minutos">0</span><span class="cifra__unidad" id="minutosUnidad">minutos</span></div>
        <div class="cifra"><span class="cifra__valor" id="segundos">0</span><span class="cifra__unidad" id="segundosUnidad">segundos</span></div>
      </div>
      <p class="solo-lectores" id="contadorAccesible"></p>
    </section>
  </main>

  <div class="inicio" id="inicio">
    <button class="semilla" id="plantar" type="button">
      <span class="semilla__corazon" id="corazonInicio">
        <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <defs>
            <radialGradient id="brilloCorazon" cx="35%" cy="28%" r="80%">
              <stop offset="0" stop-color="#ff8fa7"/>
              <stop offset="0.5" stop-color="#e8486a"/>
              <stop offset="1" stop-color="#a8163a"/>
            </radialGradient>
          </defs>
          <path fill="url(#brilloCorazon)" d="M32 58.5C-6.3 35.1 5.5 5.5 18.7 5.5c7.4 0 11.8 4.4 13.3 10.3C33.5 9.9 37.9 5.5 45.3 5.5 58.5 5.5 70.3 35.1 32 58.5Z"/>
        </svg>
      </span>
      <span class="semilla__titulo" id="ocasion"></span>
      <span class="semilla__pista" id="pista"></span>
    </button>
  </div>

  <button class="repetir" id="repetir" type="button" hidden>Plantar otra vez</button>

  <noscript>
    <div class="sin-js">
      <h1>Para el amor de mi vida:</h1>
      <p>Si pudiera elegir un lugar seguro, sería a tu lado.</p>
      <p>Cuanto más tiempo estoy contigo, más te amo.</p>
      <p>Activa JavaScript para ver crecer el árbol.</p>
    </div>
  </noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
